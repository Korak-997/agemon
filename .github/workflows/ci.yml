name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  quality:
    name: quality (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Audit the pinned skills CLI lockfile
        run: npm audit --prefix assets/tools --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Lint bundled skills
        run: npm run lint-skills

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the packaged bundle
        run: npm run smoke

      - name: Dry-run the npm publish
        run: |
          sh scripts/pack-release.sh "$RUNNER_TEMP/agemon.tgz"
          npm publish --dry-run "$RUNNER_TEMP/agemon.tgz"

  sandbox:
    name: sandbox checks
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check bundled skill fingerprints against every release
        run: npm run skills:fingerprints -- --check

      - name: Sandbox dry-run checkpoint
        run: npm run sandbox -- run clean-repo --dry-run

      - name: Sandbox roundtrip checkpoint
        run: npm run sandbox -- roundtrip clean-repo

  website:
    name: website build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix website --ignore-scripts

      - name: Audit the website dependencies
        run: npm audit --prefix website --audit-level=high

      - name: Build and verify the website
        run: npm run website:build

  macos:
    name: macos tests
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the packaged bundle
        run: npm run smoke

      - name: Sandbox dry-run checkpoint
        run: npm run sandbox -- run clean-repo --dry-run

      - name: Run inspect, status and plan
        run: |
          repo="$RUNNER_TEMP/macos-repo"
          mkdir "$repo"
          cd "$repo"
          git init --quiet
          agemon="$GITHUB_WORKSPACE/bin/agemon.js"
          node "$agemon" inspect
          node "$agemon" status
          node "$agemon" plan

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d install.sh scripts/*.sh

      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint PR commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read

    steps:
      - name: Lint PR title as a Conventional Commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
