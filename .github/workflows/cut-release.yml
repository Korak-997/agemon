name: Cut release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency: cut-release

permissions: {}

jobs:
  tag:
    name: bump, changelog, tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.deploy.outputs.tag }}

    steps:
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, draft changelog, commit and tag
        id: deploy
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          npm run deploy -- "$BUMP" --yes --skip-checks --no-push
          TAG="v$(node -p "require('./package.json').version")"
          git bundle create release.bundle master "refs/tags/${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload release commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-commit
          path: release.bundle
          if-no-files-found: error
          retention-days: 1

  push:
    name: verify and merge release commit
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}

    steps:
      - name: Download release commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-commit
          path: ${{ runner.temp }}/release-commit

      - name: Verify the release commit only bumps the version and changelog
        run: |
          set -euo pipefail

          fail() {
            echo "$1"
            exit 1
          }

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Unexpected release tag: $RELEASE_TAG"
          BUNDLE_PATH="${RUNNER_TEMP}/release-commit/release.bundle"
          RELEASE_REPO="${RUNNER_TEMP}/release-repo"
          [[ -f "$BUNDLE_PATH" && ! -L "$BUNDLE_PATH" ]] || fail "release.bundle is not a regular file."

          git init --quiet "$RELEASE_REPO"
          cd "$RELEASE_REPO"
          git bundle verify --quiet "$BUNDLE_PATH" >/dev/null 2>&1 || fail "release.bundle is not a valid git bundle."
          git fetch --quiet "$BUNDLE_PATH" "refs/heads/master:refs/heads/release" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch --quiet "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/master:refs/remotes/origin/master"

          [[ "$(git rev-list --count origin/master..release)" == 1 ]] || fail "The release is not exactly one commit on top of master."
          [[ "$(git rev-list --parents -n 1 release | wc -w)" == 2 ]] || fail "The release commit must have exactly one parent."
          [[ "$(git rev-parse release^)" == "$(git rev-parse origin/master)" ]] || fail "The release commit is not based on the current master."
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$(git rev-parse release)" ]] || fail "${RELEASE_TAG} does not point at the release commit."

          UNEXPECTED_CHANGES="$(git diff --raw --no-renames origin/master release | awk -F '\t' '{ split($1, meta, " "); if (meta[2] != "100644" || meta[5] != "M" || $2 !~ /^(CHANGELOG\.md|package\.json|package-lock\.json)$/) print }')"
          [[ -z "$UNEXPECTED_CHANGES" ]] || fail "The release commit changes more than the version and changelog: ${UNEXPECTED_CHANGES}"

          command -v jq >/dev/null || fail "jq is required to compare the manifests."
          for manifest in package.json package-lock.json; do
            if ! diff <(git show "origin/master:${manifest}" | jq -S 'del(.version, .packages[""].version)') \
              <(git show "release:${manifest}" | jq -S 'del(.version, .packages[""].version)') >/dev/null; then
              fail "${manifest} changes more than its version field."
            fi
          done
          [[ "$(git show release:package.json | jq -r .version)" == "${RELEASE_TAG#v}" ]] || fail "package.json version does not match ${RELEASE_TAG}."
          [[ "$(git diff --numstat origin/master release -- CHANGELOG.md | cut -f2)" =~ ^0?$ ]] || fail "The release commit removes CHANGELOG.md lines."

      - name: Merge release commit through a pull request and tag it
        working-directory: ${{ runner.temp }}/release-repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          fail() {
            echo "$1"
            exit 1
          }

          REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          RELEASE_BRANCH="release/${RELEASE_TAG}"
          RELEASE_TITLE="$(git log -1 --format=%s release)"
          BASE_SHA="$(git rev-parse origin/master)"
          if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/${RELEASE_TAG}" >/dev/null; then
            fail "${RELEASE_TAG} already exists on GitHub; delete it before cutting this release again."
          fi

          BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${BASIC_AUTH}"
          export GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${BASIC_AUTH}" \
            GIT_CONFIG_KEY_1="core.hooksPath" \
            GIT_CONFIG_VALUE_1="/dev/null"

          # Deleting the branch also closes the pull request if the merge never happened.
          trap 'gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1 || true' EXIT

          git push --quiet "$REPO_URL" "release:refs/heads/${RELEASE_BRANCH}"
          PR_URL="$(gh pr create --base master --head "$RELEASE_BRANCH" --title "$RELEASE_TITLE" \
            --body "Version bump and changelog for ${RELEASE_TAG}, opened by the Cut release workflow.")"
          # GitHub decides whether a new pull request can merge in the background and refuses the merge until it has.
          MERGE_ATTEMPTS=10
          for attempt in $(seq "$MERGE_ATTEMPTS"); do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_URL##*/}/merge" -f merge_method=squash \
              -f commit_title="$RELEASE_TITLE" -f commit_message="" -f sha="$(git rev-parse release)" >/dev/null; then
              break
            fi
            (( attempt < MERGE_ATTEMPTS )) || fail "GitHub refused to merge ${PR_URL} after ${MERGE_ATTEMPTS} attempts."
            sleep 3
          done

          MERGE_SHA="$(gh pr view "$PR_URL" --json mergeCommit --jq .mergeCommit.oid)"
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "${PR_URL} did not report a merge commit."
          git fetch --quiet "$REPO_URL" "$MERGE_SHA"
          [[ "$(git rev-parse "${MERGE_SHA}^")" == "$BASE_SHA" ]] || fail "master moved before ${PR_URL} merged; tag ${RELEASE_TAG} by hand."
          [[ "$(git rev-parse "${MERGE_SHA}^{tree}")" == "$(git rev-parse "release^{tree}")" ]] || fail "The merge of ${PR_URL} differs from the verified release commit."

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag --force --annotate "$RELEASE_TAG" --message "$RELEASE_TAG" "$MERGE_SHA"
          git push --quiet "$REPO_URL" "refs/tags/${RELEASE_TAG}"

  publish:
    needs: [tag, push]
    permissions:
      contents: write
      id-token: write
      attestations: write
      pages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
